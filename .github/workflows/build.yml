name: Build-Test-Publish

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  PROJECT: ./CICDProject/CICDProject/CICDProject.csproj
  TEST_PROJECT: ./CICDProject/CICDApi.UnitTests/CICDApi.UnitTests.csproj

jobs:

#----------------------------------------------------------
# BUILD
#----------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore Packages
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build Project
        run: |
          dotnet build ${{ env.PROJECT }} \
            --configuration Release \
            --no-restore

#----------------------------------------------------------
# TEST
#----------------------------------------------------------
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore Packages
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Run NUnit Tests
        run: |
          dotnet test ${{ env.TEST_PROJECT }} \
            --configuration Release \
            --no-restore \
            --logger "trx;LogFileName=test-results.trx" \
            /p:CollectCoverage=true \
            /p:CoverletOutput=./TestResults/ \
            /p:CoverletOutputFormat=cobertura \
            /p:Threshold=70 \
            /p:ThresholdType=line \
            /p:ThresholdStat=total

      # Uncomment only if you need to debug paths
      # - name: Show Coverage Files
      #   run: |
      #     find . -name "*.trx"
      #     find . -name "coverage.cobertura.xml"

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/*.trx"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            "-reports:./CICDProject/CICDApi.UnitTests/TestResults/coverage.cobertura.xml" \
            "-targetdir:coveragereport" \
            "-reporttypes:Html;MarkdownSummary"

      - name: Display Coverage Summary
        run: cat coveragereport/Summary.md

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: CodeCoverageReport
          path: coveragereport

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults
          path: ./CICDProject/CICDApi.UnitTests/TestResults

#----------------------------------------------------------
# PUBLISH
#----------------------------------------------------------
  publish:
    name: Publish API
    runs-on: ubuntu-latest
    needs:
      - build
      - test

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore Packages
        run: dotnet restore ${{ env.PROJECT }}

      - name: Publish API
        run: |
          dotnet publish ${{ env.PROJECT }} \
            --configuration Release \
            --no-restore \
            --output ./publish

      - name: Upload Published API
        uses: actions/upload-artifact@v4
        with:
          name: PublishedAPI
          path: ./publish