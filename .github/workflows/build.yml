  name: .NET Build

  on:
    push:
      branches:
        - main
        - develop
    pull_request:
      branches:
        - main
        - develop

  jobs:
    build:

      runs-on: ubuntu-latest

      steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore packages
        run: dotnet restore ./CICDProject/CICDProject/CICDProject.csproj

      - name: Build
        run: dotnet build ./CICDProject/CICDProject/CICDProject.csproj --configuration Release --no-restore

      
      # Debug - remove this step after confirming the path
      # - name: Display Repository Structure
      #   run: |
      #     pwd
      #     echo "-------------------------"
      #     find . -name "*.csproj"
      #     echo "-------------------------"
      #     ls -R
      

      # - name: Run Tests with Coverage
      #   run: |
      #     dotnet test ./CICDProject/CICDApi.UnitTests/CICDApi.UnitTests.csproj \
      #       --configuration Release \
      #       --collect:"XPlat Code Coverage"

      - name: Run Tests with Coverage
        run: |
          dotnet test ./CICDProject/CICDApi.UnitTests/CICDApi.UnitTests.csproj \
            --configuration Release \
            --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:Threshold=70 \
            /p:ThresholdType=line \
            /p:ThresholdStat=total

          - name: Install ReportGenerator
            run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            -reports:**/coverage.cobertura.xml \
            -targetdir:coveragereport \
            -reporttypes:Html

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport

      - name: Publish
        run: |
          dotnet publish ./CICDProject/CICDProject/CICDProject.csproj \
            --configuration Release \
            --no-build \
            --output ./publish

      - name: Upload Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-publish
          path: ./publish